# тут запускаем базу, airflow и jupyter вместе, параметры портов можно переопределить через енв
services:
  postgres:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER_NAME:-postgres}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT_OUT:-5444}:${POSTGRES_PORT_IN:-5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5

  # сначала миграции airflow и создание подключений, вебсервер с планировщиком дождутся завершения
  airflow-initdb:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /usr/local/airflow/logs
      AIRFLOW__LOGGING__REMOTE_LOGGING: False
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_PORT: ${POSTGRES_PORT_IN:-5432}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT_IN:-5432}/${POSTGRES_DB:-airflow}
    entrypoint: >
      bash -c "airflow db migrate && python /usr/local/airflow/bootstrap_airflow.py"

  #вебсервер показывает UI, сами задачи запускает scheduler ниже
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-initdb:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /usr/local/airflow/logs
      AIRFLOW__LOGGING__REMOTE_LOGGING: False
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: True
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_PORT: ${POSTGRES_PORT_IN:-5432}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT_IN:-5432}/${POSTGRES_DB:-airflow}
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ./logs:/usr/local/airflow/logs
      - ./data:/usr/local/airflow/data
    ports:
      - "${AIRFLOW_PORT_OUT:-8080}:${AIRFLOW_PORT_IN:-8080}"
    command: >
      bash -c "airflow webserver"

  # локальный executor выполняет задачи в контейнере планировщика, папки dags и logs общие с вебсервером
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-initdb:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /usr/local/airflow/logs
      AIRFLOW__LOGGING__REMOTE_LOGGING: False
      AIRFLOW__LOGGING__LOG_LEVEL: INFO
      AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: False
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_PORT: ${POSTGRES_PORT_IN:-5432}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT_IN:-5432}/${POSTGRES_DB:-airflow}
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ./logs:/usr/local/airflow/logs
      - ./data:/usr/local/airflow/data
    command: >
      bash -c "mkdir -p /usr/local/airflow/logs && 
               airflow scheduler"

  # jupyter для исследования, папку notebooks с компьютера видим внутри как work
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: jupyter
    ports:
      - "${JUPYTER_PORT_OUT:-8888}:${JUPYTER_PORT_IN:-8888}"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    environment:
      JUPYTER_ENABLE_LAB: yes
      SPARK_JARS: /usr/local/spark/jars/postgresql-42.7.0.jar
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_PORT: ${POSTGRES_PORT_IN:-5432}
    command: >
      sh -c "pip install psycopg2-binary && 
             start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''"

volumes:
  postgres_data: